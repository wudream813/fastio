name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & test
        run: |
          g++ --version
          make test
      - name: Quick benchmark (8 MiB)
        run: |
          make bench_lib variants_bench options_bench options_bench_fast
          ./bench_lib 8
          ./variants_bench 8
          ./options_bench 8
          ./options_bench_fast 8
